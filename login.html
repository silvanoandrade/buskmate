<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | BuskMate</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><img src="assets/logo-white.svg" alt="BuskMate" class="logo-img"></a>
      <nav class="nav">
        <a href="mapa.html" data-i18n="nav_map">Mapa</a>
        <a href="login.html" data-i18n="nav_login">Login</a>
        <a href="cadastro.html" class="btn-nav" data-i18n="nav_register">Cadastrar</a>
        <div class="lang-switcher">
          <button id="lang-toggle" class="lang-toggle" aria-label="Change language" aria-haspopup="true">
            🌐 <span id="lang-current">PT</span>
          </button>
          <ul id="lang-menu" class="lang-menu" hidden>
            <li class="lang-option" data-lang="pt">🇵🇹 Português</li>
            <li class="lang-option" data-lang="en">🇬🇧 English</li>
            <li class="lang-option" data-lang="es">🇪🇸 Español</li>
          </ul>
        </div>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1 data-i18n="login_title">Entrar</h1>
      <p class="auth-subtitle" data-i18n="login_subtitle">Acesse sua conta para avaliar e comentar spots.</p>
      <form id="form-login" novalidate>
        <label for="email" data-i18n="label_email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="senha" data-i18n="label_senha">Senha</label>
        <input type="password" id="senha" name="senha" required>

        <p class="form-message" id="form-message" role="alert"></p>

        <button type="submit" class="btn btn-primary btn-block" data-i18n="btn_entrar">Entrar</button>
      </form>
      <p class="auth-switch"><span data-i18n="login_switch">Ainda não tem conta?</span> <a href="cadastro.html" data-i18n="login_switch_link">Cadastre-se</a></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p data-i18n="footer_text">BuskMate Beta &middot; MVP para localização e avaliação de spots de música de rua no Porto</p>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
