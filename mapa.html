<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Spots | BuskMate</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><img src="assets/logo-white.svg" alt="BuskMate" class="logo-img"></a>
      <nav class="nav">
        <a href="mapa.html" class="active" data-i18n="nav_map">Mapa</a>
        <a href="login.html" id="nav-login" data-i18n="nav_login">Login</a>
        <a href="cadastro.html" id="nav-cadastro" class="btn-nav" data-i18n="nav_register">Cadastrar</a>
        <span id="nav-user" class="nav-user" hidden></span>
        <div class="lang-switcher">
          <button id="lang-toggle" class="lang-toggle" aria-label="Change language" aria-haspopup="true">
            🌐 <span id="lang-current">PT</span>
          </button>
          <ul id="lang-menu" class="lang-menu" hidden>
            <li class="lang-option" data-lang="pt">🇵🇹 Português</li>
            <li class="lang-option" data-lang="en">🇬🇧 English</li>
            <li class="lang-option" data-lang="es">🇪🇸 Español</li>
          </ul>
        </div>
      </nav>
    </div>
  </header>

  <main class="map-page">
    <div id="map"></div>

    <aside id="spot-panel" class="spot-panel" hidden>
      <button id="close-panel" class="close-panel" aria-label="Fechar">&times;</button>
      <div id="spot-content"></div>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/spots.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
