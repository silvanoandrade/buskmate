<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro | BuskMate</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><img src="assets/logo-white.svg" alt="BuskMate" class="logo-img"></a>
      <nav class="nav">
        <a href="mapa.html">Mapa</a>
        <a href="login.html">Login</a>
        <a href="cadastro.html" class="btn-nav">Cadastrar</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Criar conta</h1>
      <p class="auth-subtitle">Junte-se à comunidade BuskMate e comece a descobrir spots.</p>
      <form id="form-cadastro" novalidate>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" minlength="6" required>

        <label for="confirmar-senha">Confirmar senha</label>
        <input type="password" id="confirmar-senha" name="confirmar-senha" minlength="6" required>

        <p class="form-message" id="form-message" role="alert"></p>

        <button type="submit" class="btn btn-primary btn-block">Cadastrar</button>
      </form>
      <p class="auth-switch">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>BuskMate Beta &middot; MVP para localização e avaliação de spots de música de rua no Porto</p>
    </div>
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
